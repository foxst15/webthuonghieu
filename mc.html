<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fox Craft V9.0 - Java 1.21.8 Engine 🦊🎀</title>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #000; touch-action: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M10 0v20M0 10h20" stroke="white" stroke-width="2" style="filter:drop-shadow(1px 1px 1px black);"/></svg>'); transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none; }
        #hud { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: none; gap: 20px; z-index: 5; }
        .bar { width: 200px; height: 15px; background: #333; border: 2px solid white; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        #health .bar-fill { background: #ff3333; } 
        #hunger .bar-fill { background: #ff9900; } 
        .icon { position: absolute; left: -25px; top: -5px; font-size: 20px; }
        #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.6); padding: 5px; border-radius: 5px; display: none; gap: 5px; border: 2px solid #555; z-index: 15; }
        .slot { width: 45px; height: 45px; background: rgba(255, 255, 255, 0.1); border: 2px solid #888; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 24px; cursor: pointer; position: relative; transition: transform 0.1s; }
        .slot.active { border-color: #00FFFF; background: rgba(255, 255, 255, 0.4); transform: scale(1.15); box-shadow: 0 0 15px #00FFFF; z-index: 20; }
        .slot-img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; object-fit: cover; position: absolute; }
        .slot-num { position:absolute; top:2px; left:2px; font-size:10px; text-shadow:1px 1px 0 #000; color: white; font-family: monospace; }
        #fps { position: absolute; top: 5px; left: 5px; color: #00FF00; font-weight: bold; text-shadow: 1px 1px 0 #000; z-index: 10; font-size: 18px; display: none; }
        #loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 200; display: flex; flex-direction: column; align-items:center; justify-content:center; color:#00FFFF; font-size:24px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; }
        .start-text { font-size: 30px; font-weight: bold; color: #ff69b4; text-shadow: 2px 2px 0px #fff; animation: pulse-start 1s infinite alternate; text-align: center; padding: 20px;}
        @keyframes pulse-start { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        .menu-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px); }
        .mc-title { font-size: 60px; font-weight: 900; color: #a8a8a8; text-shadow: 4px 4px 0 #000, 0px 4px 0 #000, 4px 0px 0 #000, -2px -2px 0 #fff; font-family: 'Arial Black', Impact, sans-serif; letter-spacing: 2px; line-height: 1; }
        .mc-btn { background: #c6c6c6; border: 2px solid #111; border-top-color: #fefefe; border-left-color: #fefefe; border-bottom-color: #555; border-right-color: #555; color: #333; font-weight: bold; font-size: 16px; padding: 10px 15px; cursor: pointer; width: 250px; text-align: center; user-select: none; box-shadow: inset -2px -2px 0px rgba(0,0,0,0.25); margin-bottom: 10px; font-family: 'Courier New', Courier, monospace; }
        #inventory { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 580px; background: rgba(30, 30, 30, 0.95); border: 4px solid #555; border-radius: 10px; padding: 20px; display: none; z-index: 50; flex-direction: column; align-items: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); max-height: 85vh; overflow-y: auto; }
        #inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: 100%; justify-items: center; }
        .inv-item { width: 48px; height: 48px; background: rgba(255,255,255,0.1); border: 2px solid #777; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; font-size: 24px; color: white;}
        .inv-item:hover { background: rgba(255,255,255,0.3); border-color: white; }
        .inv-item .tooltip { position: absolute; bottom: -30px; background: rgba(0,0,0,0.85); color: white; padding: 4px 8px; border: 1px solid #aaa; border-radius: 4px; font-size: 12px; font-weight: bold; white-space: nowrap; pointer-events: none; display: none; z-index: 100; text-shadow: 1px 1px 0 #000; }
        .inv-item:hover .tooltip { display: block; }
        #btn-close-inv { position: absolute; top: 10px; right: 10px; background: #ff3333; color: white; width: 30px; height: 30px; border-radius: 5px; text-align: center; line-height: 30px; font-weight: bold; cursor: pointer; border: 2px solid #aa0000; z-index: 60; }
    </style>
</head>
<body>

    <div id="start-overlay"><div class="start-text">🐾 CHẠM ĐỂ CHƠI 🐾</div><p style="color:#aaa; margin-top:10px;">(Tải Engine Java 1.21.8...)</p></div>
    <div id="loading-overlay" style="display:none;">...FOXCRAFT 1.21.8...</div>

    <div id="crosshair"></div><div id="fps">FPS: 0</div>
    <div id="hud"><div id="health" class="bar"><span class="icon">❤️</span><div class="bar-fill" id="health-fill" style="width: 100%;"></div></div></div>
    <div id="hotbar"></div>

    <div id="inventory"><div id="btn-close-inv">X</div><h2>🎒 Túi đồ Java 1.21.8 🎀</h2><div id="inv-grid"></div></div>

    <div id="main-menu" class="menu-panel">
        <div style="text-align: center; margin-bottom: 30px;"><div class="mc-title">FOXCRAFT</div><div style="color:#fff; letter-spacing: 4px; font-weight: bold;">JAVA 1.21.8 ENGINE</div></div>
        <div class="mc-btn" id="btn-create-world">Tạo & Chơi!</div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } } </script>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        
        // 🎀 BÉ LÔI FIX ĐƯỜNG DẪN TRỎ ĐÚNG VÀO THƯ MỤC FoxCraft_Engine_1.21.8
        import { FoxCraftBlockLoader } from './FoxCraft_Engine_1.21.8/FoxCraftBlockLoader.js';

        let scene, camera, renderer, controls, raycaster, blockLoader;
        let objects = [], worldMap = new Map();
        let hotbarSlots = [1, 2, 3, 4, 1050, 1052, 1058]; 
        let currentHotbarIndex = 0, isInventoryOpen = false;

        async function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // 🎀 BÉ LÔI FIX ĐƯỜNG DẪN NẠP DATABASE TRONG FoxCraft_Engine_1.21.8
            blockLoader = new FoxCraftBlockLoader(scene, {
                basePath: './FoxCraft_Engine_1.21.8/assets/minecraft-1.21.8'
            });

            await blockLoader.loadDatabase();

            const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            controls = new PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            raycaster = new THREE.Raycaster();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            renderHotbar();
            renderInventory();
            generateWorld();

            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';

            document.getElementById('btn-create-world').onclick = () => {
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('hotbar').style.display = 'flex';
                controls.getObject().position.set(0, 5, 0);
                controls.lock();
                animate();
            };

            document.getElementById('start-overlay').onclick = function() { this.style.display = 'none'; };
            document.getElementById('btn-close-inv').onclick = () => closeInventory();
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('mousedown', onMouseDown);
        }

        function generateWorld() {
            for (let x = -8; x <= 8; x++) {
                for (let z = -8; z <= 8; z++) {
                    createBlockMesh(x, 0, z, 'minecraft:grass_block');
                    createBlockMesh(x, -1, z, 'minecraft:dirt');
                    createBlockMesh(x, -2, z, 'minecraft:stone');
                }
            }
        }

        function createBlockMesh(x, y, z, identifier) {
            const key = `${x},${y},${z}`;
            if (worldMap.has(key)) return;
            const mesh = blockLoader.createBlockMesh(identifier, new THREE.Vector3(x, y, z));
            scene.add(mesh);
            objects.push(mesh);
            worldMap.set(key, mesh);
        }

        function renderHotbar() {
            const hotbar = document.getElementById('hotbar');
            hotbar.innerHTML = '';
            hotbarSlots.forEach((id, idx) => {
                const block = blockLoader.blocksMap.get(id);
                const div = document.createElement('div');
                div.className = idx === currentHotbarIndex ? 'slot active' : 'slot';
                div.innerHTML = `<span class="slot-num">${idx+1}</span>${block ? block.name.slice(0,2) : ''}`;
                div.onclick = () => { currentHotbarIndex = idx; renderHotbar(); };
                hotbar.appendChild(div);
            });
        }

        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            blockLoader.blocksMap.forEach((block, key) => {
                if (typeof key === 'number') {
                    const div = document.createElement('div');
                    div.className = 'inv-item';
                    div.innerHTML = `📦<div class="tooltip">${block.name}</div>`;
                    div.onclick = () => { hotbarSlots[currentHotbarIndex] = block.id; renderHotbar(); };
                    grid.appendChild(div);
                }
            });
        }

        function toggleInventory() {
            isInventoryOpen = !isInventoryOpen;
            document.getElementById('inventory').style.display = isInventoryOpen ? 'flex' : 'none';
            if (isInventoryOpen) controls.unlock(); else controls.lock();
        }

        function closeInventory() {
            isInventoryOpen = false;
            document.getElementById('inventory').style.display = 'none';
            controls.lock();
        }

        function onKeyDown(e) {
            if (e.code === 'KeyE') toggleInventory();
        }

        function onMouseDown(e) {
            if (!controls.isLocked) return;
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) { // Đập khối
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                } else if (e.button === 2) { // Đặt khối 1.21.8
                    const norm = intersect.face.normal;
                    const pos = intersect.object.position.clone().add(norm);
                    const selectedBlockId = hotbarSlots[currentHotbarIndex];
                    createBlockMesh(pos.x, pos.y, pos.z, selectedBlockId);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        initEngine();
    </script>
</body>
</html>
